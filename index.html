    <!--
      Google Identity Services (GIS) token model. There is no npm package for GIS;
      it is a CDN <script> loaded once. The Drive connect flow (Plan 06) calls
      google.accounts.oauth2.initTokenClient against the drive.file scope only.
    -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
